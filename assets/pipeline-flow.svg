<text x="832.0" y="172" font-size="13" text-anchor="middle" fill="#cbd5e1">Claude Sonnet, no agents</text>
<text x="832.0" y="190" font-size="13" text-anchor="middle" fill="#cbd5e1">no round trip</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
<rect x="958" y="110" width="212" height="100" rx="14" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="2"/>
