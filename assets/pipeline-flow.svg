<text x="368.0" y="172" font-size="13" text-anchor="middle" fill="#cbd5e1">3 calls max</text>
<text x="368.0" y="190" font-size="13" text-anchor="middle" fill="#cbd5e1">in parallel</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
<rect x="494" y="110" width="212" height="100" rx="14" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
