<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Pipeline: Plan, Codex implements (3 max in parallel), tests, one Claude verification, done; fallback without OpenAI: Sonnet alone plus architecte">
