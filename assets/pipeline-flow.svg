<text x="136.0" y="190" font-size="13" text-anchor="middle" fill="#cbd5e1">the brief + test command</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
<rect x="262" y="110" width="212" height="100" rx="14" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
