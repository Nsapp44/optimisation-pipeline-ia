<text x="600.0" y="190" font-size="13" text-anchor="middle" fill="#cbd5e1">venv interpreter</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8999999999999999s" fill="freeze"/>
<rect x="726" y="110" width="212" height="100" rx="14" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c" stroke-width="2"/>
